name: Verify brandkit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Verify committed vector assets
        run: git diff --exit-code -- ':(glob)assets/generated/**/*.svg'
